<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naviance Explorer — High School Data</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root {
    --blue: #1a3a5c;
    --blue-mid: #2d6aa0;
    --blue-light: #e8f2fb;
    --green: #22c55e;
    --red: #ef4444;
    --amber: #f59e0b;
    --purple: #8b5cf6;
    --gray: #6b7280;
    --border: #d1d5db;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: #1e293b; font-size: 14px; }

  /* ── header ── */
  .site-header {
    background: var(--blue); color: white; padding: 12px 24px;
    display: flex; align-items: center; gap: 16px;
  }
  .site-header h1 { font-size: 18px; font-weight: 600; }
  .site-header .subtitle { font-size: 12px; opacity: 0.7; }

  /* ── selector bar ── */
  .selector-bar {
    background: white; border-bottom: 1px solid var(--border);
    padding: 12px 24px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 100;
  }
  .selector-bar label { font-weight: 600; color: var(--blue); white-space: nowrap; }
  .selector-bar select {
    flex: 1; max-width: 420px; padding: 8px 12px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; background: white; cursor: pointer;
  }
  .selector-bar select:focus { outline: 2px solid var(--blue-mid); }
  .badge {
    background: var(--blue-light); color: var(--blue-mid);
    padding: 3px 10px; border-radius: 12px; font-size: 12px; white-space: nowrap;
  }

  /* ── college profile ── */
  .profile { max-width: 1280px; margin: 0 auto; padding: 20px 24px; }

  .college-header {
    display: flex; align-items: baseline; gap: 12px;
    border-bottom: 2px solid var(--blue); padding-bottom: 12px; margin-bottom: 16px;
  }
  .college-header h2 { font-size: 24px; color: var(--blue); }
  .college-header a { font-size: 13px; color: var(--blue-mid); text-decoration: none; }
  .college-header a:hover { text-decoration: underline; }
  .match-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: #e0f2fe; color: #0369a1;
  }

  /* ── quick facts strip ── */
  .quick-facts {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
  }
  .qf-card {
    background: white; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 14px; min-width: 130px;
  }
  .qf-card .qf-label { font-size: 11px; color: var(--gray); text-transform: uppercase;
                        letter-spacing: 0.05em; margin-bottom: 2px; }
  .qf-card .qf-value { font-size: 14px; font-weight: 600; color: var(--blue); }

  /* ── two-column layout ── */
  .two-col { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }

  /* ── left panel ── */
  .info-panel { display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: white; border: 1px solid var(--border); border-radius: 10px;
    overflow: hidden;
  }
  .card-title {
    background: var(--blue-light); color: var(--blue);
    font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; padding: 8px 14px;
  }
  .card-body { padding: 12px 14px; }

  /* acceptance rate big number */
  .acceptance-rate {
    text-align: center; padding: 16px 8px;
  }
  .acceptance-rate .rate-num {
    font-size: 44px; font-weight: 700; color: var(--blue-mid); line-height: 1;
  }
  .acceptance-rate .rate-label {
    font-size: 12px; color: var(--gray); margin-top: 4px;
  }

  .info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0; border-bottom: 1px solid #f1f5f9;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .key { color: var(--gray); }
  .info-row .val { font-weight: 500; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px;
    font-weight: 600;
  }
  .pill.yes { background: #dcfce7; color: #15803d; }
  .pill.no  { background: #fee2e2; color: #b91c1c; }
  .pill.na  { background: #f1f5f9; color: var(--gray); }

  /* ── right panel ── */
  .scatter-panel { display: flex; flex-direction: column; gap: 0; }

  .score-tabs {
    display: flex; gap: 4px; margin-bottom: 8px;
  }
  .tab-btn {
    padding: 6px 18px; border: 1px solid var(--border); border-radius: 6px;
    background: white; cursor: pointer; font-size: 13px; font-weight: 500;
    color: var(--gray); transition: all 0.15s;
  }
  .tab-btn.active {
    background: var(--blue); color: white; border-color: var(--blue);
  }
  .tab-btn:hover:not(.active) { background: var(--blue-light); color: var(--blue); }
  .tab-btn:disabled { opacity: 0.35; cursor: default; }

  .scatter-wrap { position: relative; }
  #scatter-chart { border: 1px solid var(--border); border-radius: 10px; background: white; }
  #scatter-nodata {
    display: none; text-align: center; color: var(--gray); padding: 60px 20px;
    font-size: 16px; background: white; border: 1px solid var(--border); border-radius: 10px;
  }

  .history-wrap { position: relative; }
  #history-nodata {
    display: none; text-align: center; color: var(--gray); padding: 24px; font-size: 14px;
  }

  /* ── history section ── */
  .history-section { margin-top: 20px; }
  #history-chart { border: 1px solid var(--border); border-radius: 10px; background: white; }

  /* ── empty state ── */
  #empty-state {
    text-align: center; color: var(--gray);
    padding: 80px 20px; font-size: 18px;
  }
</style>
</head>
<body>

<header class="site-header">
  <div>
    <div class="h1" style="font-size:18px;font-weight:600;color:white;">Naviance Explorer</div>
    <div class="subtitle">Locally supplied high-school data</div>
  </div>
</header>

<div class="selector-bar">
  <label for="college-select">College</label>
  <select id="college-select" onchange="renderCollege(this.value)">
    <option value="">— select a college —</option>
  </select>
  <span id="app-count-badge" class="badge" style="display:none"></span>
</div>

<div class="profile">
  <div id="empty-state">Select a college above to view its profile.</div>
  <div id="college-content" style="display:none">
    <div class="college-header">
      <h2 id="college-name"></h2>
      <a id="college-link" href="#" target="_blank"></a>
      <span id="match-badge" class="match-badge"></span>
    </div>

    <div class="quick-facts" id="quick-facts"></div>

    <div class="two-col">
      <div class="info-panel">
        <div class="card">
          <div class="card-title">Admissions</div>
          <div class="card-body">
            <div class="acceptance-rate">
              <div class="rate-num" id="acceptance-rate">—</div>
              <div class="rate-label">acceptance rate</div>
            </div>
            <div id="admissions-rows"></div>
          </div>
        </div>
        <div class="card">
          <div class="card-title">Policies</div>
          <div class="card-body" id="policies-rows"></div>
        </div>
      </div>

      <div class="scatter-panel">
        <div class="score-tabs" id="score-tabs"></div>
        <div class="scatter-wrap">
          <div id="scatter-chart"></div>
          <div id="scatter-nodata">No scattergram data for this college.</div>
        </div>
      </div>
    </div>

    <div class="history-section">
      <div class="card">
        <div class="card-title">High School Application History</div>
        <div class="card-body" style="padding:0">
          <div class="history-wrap">
            <div id="history-chart"></div>
            <div id="history-nodata">No application history data.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DATA = __DATA_PLACEHOLDER__;

// ── index data ────────────────────────────────────────────────────────────────
const byName = {};
DATA.forEach(c => { byName[c.name] = c; });

// ── populate dropdown ─────────────────────────────────────────────────────────
const sel = document.getElementById('college-select');
DATA.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c.name;
  opt.textContent = c.name + (c.app_count ? ` (${c.app_count} apps)` : '');
  sel.appendChild(opt);
});

// ── colour / symbol maps ──────────────────────────────────────────────────────
// Color encodes outcome; open/filled + shape encodes decision type —
// mirroring Naviance: RD = bare marker, ED = circle outline around marker, EA = square outline
function outcomeColor(g) {
  if (g.startsWith('Accepted'))            return '#16a34a';
  if (g.startsWith('Denied'))              return '#dc2626';
  if (g.startsWith('Waitlisted/Accepted')) return '#d97706';
  if (g.startsWith('Waitlisted/Denied'))   return '#ea580c';
  return '#6366f1';  // Waitlisted/Unknown + Legend
}

// Per-outcome base shape (RD=filled, ED=open circle outline, EA=open square outline)
function outcomeBaseSymbol(outcome) {
  if (outcome.startsWith('Accepted'))  return 'circle';
  if (outcome.startsWith('Denied'))    return 'cross';    // ✕ shape for denied
  return 'triangle-up';                                    // waitlisted
}

// Map decision type → marker variant (filled vs open)
// Regular Decision: filled (solid)
// Early Decision:   -open  (hollow with outline — like circle outline around marker)
// Early Action:     -open  with square override
function markerSpec(outcome, decision) {
  const base = outcomeBaseSymbol(outcome);
  const color = outcomeColor(outcome);
  if (decision === 'Early Decision') {
    return { symbol: base + '-open', size: 12, color, line: { color, width: 2.5 } };
  }
  if (decision === 'Early Action') {
    return { symbol: 'square-open', size: 12, color, line: { color, width: 2.5 } };
  }
  // Regular Decision: filled
  return { symbol: base, size: 9, color, line: { color: 'rgba(255,255,255,0.4)', width: 1 } };
}

// ── current state ─────────────────────────────────────────────────────────────
let activeScoreType = null;

// ── render ────────────────────────────────────────────────────────────────────
function renderCollege(name) {
  if (!name) {
    document.getElementById('empty-state').style.display = '';
    document.getElementById('college-content').style.display = 'none';
    document.getElementById('app-count-badge').style.display = 'none';
    return;
  }
  const c = byName[name];
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('college-content').style.display = '';

  // Header
  document.getElementById('college-name').textContent = c.name;
  const link = document.getElementById('college-link');
  const website = c.quick_facts['Website'] || c.profile_url || '';
  if (website) { link.href = website; link.textContent = website.replace(/^https?:\/\//, ''); }
  else { link.textContent = ''; }

  const mb = document.getElementById('match-badge');
  mb.textContent = c.match_method ? 'match: ' + c.match_method : 'unmatched';

  const badge = document.getElementById('app-count-badge');
  if (c.app_count) {
    badge.textContent = c.app_count + ' apps from this school';
    badge.style.display = '';
  } else { badge.style.display = 'none'; }

  // Quick facts (exclude Website, CEEB code, ACT code — shown elsewhere)
  const SKIP_QF = new Set(['Website', 'CEEB code', 'ACT code']);
  const qfEl = document.getElementById('quick-facts');
  qfEl.innerHTML = '';
  Object.entries(c.quick_facts).forEach(([k, v]) => {
    if (SKIP_QF.has(k) || !v) return;
    const d = document.createElement('div');
    d.className = 'qf-card';
    d.innerHTML = `<div class="qf-label">${k}</div><div class="qf-value">${v}</div>`;
    qfEl.appendChild(d);
  });

  // Admissions summary
  const adm = c.admissions_summary;
  const rateEl = document.getElementById('acceptance-rate');
  if (adm.acceptance_rate_pct != null) {
    rateEl.textContent = adm.acceptance_rate_pct.toFixed(0) + '%';
    rateEl.style.color = adm.acceptance_rate_pct < 15 ? '#dc2626' :
                         adm.acceptance_rate_pct < 30 ? '#d97706' : '#2d6aa0';
  } else { rateEl.textContent = '—'; rateEl.style.color = '#2d6aa0'; }

  const admRows = document.getElementById('admissions-rows');
  const admInfo = [
    ['Application fee', adm.application_fee != null ? (adm.application_fee === 0 ? 'Free' : '$' + adm.application_fee) : null],
    ['Test optional',   adm.test_optional != null ? adm.test_optional : null],
    ['Common App',      adm.accepts_common_app != null ? adm.accepts_common_app : null],
    ['Coalition App',   adm.accepts_coalition_app != null ? adm.accepts_coalition_app : null],
    ['Early decision',  adm.early_decision != null ? adm.early_decision : null],
    ['Wait list',       adm.wait_list != null ? adm.wait_list : null],
  ];
  admRows.innerHTML = admInfo.filter(([,v]) => v != null).map(([k, v]) => {
    const val = typeof v === 'number' ? pillBool(v) : `<span class="val">${v}</span>`;
    return `<div class="info-row"><span class="key">${k}</span>${val}</div>`;
  }).join('');

  // Policies
  const polEl = document.getElementById('policies-rows');
  const pol = c.admissions_policies;
  polEl.innerHTML = Object.entries(pol).map(([k, v]) => {
    const isBool = v === 'Yes' || v === 'No';
    const val = isBool ? `<span class="pill ${v === 'Yes' ? 'yes' : 'no'}">${v}</span>`
                       : `<span class="val" style="font-size:12px;color:#374151">${v}</span>`;
    return `<div class="info-row"><span class="key">${k}</span>${val}</div>`;
  }).join('');

  // Scattergram tabs + initial render
  const types = Object.keys(c.scattergrams);
  const tabsEl = document.getElementById('score-tabs');
  tabsEl.innerHTML = '';
  if (types.length === 0) {
    showScatterNoData(true, 'No scattergram data for this college.');
    activeScoreType = null;
  } else {
    showScatterNoData(false);
    activeScoreType = types.includes('SAT') ? 'SAT' : types[0];
    types.forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (t === activeScoreType ? ' active' : '');
      btn.textContent = c.scattergrams[t].label || t;
      btn.onclick = () => {
        activeScoreType = t;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderScatter(c, t);
      };
      tabsEl.appendChild(btn);
    });
    renderScatter(c, activeScoreType);
  }

  // HS history chart
  renderHistory(c);
}

function showScatterNoData(show, msg) {
  document.getElementById('scatter-chart').style.display = show ? 'none' : '';
  const nd = document.getElementById('scatter-nodata');
  nd.style.display = show ? '' : 'none';
  if (msg) nd.textContent = msg;
}

function pillBool(v) {
  if (v === 1) return '<span class="pill yes">Yes</span>';
  if (v === 0) return '<span class="pill no">No</span>';
  return '<span class="pill na">—</span>';
}

// ── scattergram ───────────────────────────────────────────────────────────────
function renderScatter(college, scoreType) {
  const sg = college.scattergrams[scoreType];
  if (!sg || sg.points.length === 0) {
    showScatterNoData(true, 'No data points for ' + scoreType + '.');
    return;
  }
  showScatterNoData(false);

  // Group points by (outcome, decision)
  const groups = {};
  const userPoints = [];

  sg.points.forEach(p => {
    if (p.is_user_point) { userPoints.push(p); return; }
    const key = p.outcome_group + '|||' + (p.decision_type || '');
    if (!groups[key]) groups[key] = { outcome: p.outcome_group, decision: p.decision_type || 'Regular Decision', pts: [] };
    groups[key].pts.push(p);
  });

  // Sort groups: Denied first (bottom), then Waitlisted, then Accepted (top, drawn last so visible)
  const ORDER = ['Denied', 'Waitlisted', 'Accepted'];
  const sortedKeys = Object.keys(groups).sort((a, b) => {
    const oa = ORDER.findIndex(o => groups[a].outcome.startsWith(o));
    const ob = ORDER.findIndex(o => groups[b].outcome.startsWith(o));
    return (oa === -1 ? 0 : oa) - (ob === -1 ? 0 : ob);
  });

  const traces = sortedKeys.map(k => {
    const g = groups[k];
    const ms = markerSpec(g.outcome, g.decision);
    const shortOutcome = g.outcome.replace('Waitlisted/', 'WL/');
    const decLabel = g.decision === 'Regular Decision' ? 'RD'
                   : g.decision === 'Early Decision'   ? 'ED'
                   : g.decision === 'Early Action'     ? 'EA' : g.decision;
    return {
      type: 'scatter', mode: 'markers',
      name: shortOutcome + ' · ' + decLabel,
      x: g.pts.map(p => p.x_value),
      y: g.pts.map(p => p.y_value),
      text: g.pts.map(p => `<b>${p.outcome_group}</b><br>${p.decision_type}<br>Score: ${p.x_value}<br>GPA: ${p.y_value != null ? p.y_value.toFixed(2) : '—'}`),
      hovertemplate: '%{text}<extra></extra>',
      marker: { ...ms, opacity: 0.88 },
    };
  });

  // User point on top
  if (userPoints.length > 0) {
    traces.push({
      type: 'scatter', mode: 'markers',
      name: 'You',
      x: userPoints.map(p => p.x_value),
      y: userPoints.map(p => p.y_value),
      text: userPoints.map(p => `<b>Your score</b><br>Score: ${p.x_value}<br>GPA: ${p.y_value != null ? p.y_value.toFixed(2) : '—'}`),
      hovertemplate: '%{text}<extra></extra>',
      marker: { color: '#6366f1', symbol: 'star', size: 18, opacity: 1,
                line: { color: '#3730a3', width: 1.5 } },
    });
  }

  const layout = {
    xaxis: {
      title: { text: sg.x_label || scoreType, font: { size: 13 } },
      gridcolor: '#f1f5f9', zeroline: false,
    },
    yaxis: {
      title: { text: sg.y_label || 'GPA', font: { size: 13 } },
      gridcolor: '#f1f5f9', zeroline: false,
    },
    legend: { orientation: 'h', y: -0.18, font: { size: 11 } },
    margin: { l: 54, r: 16, t: 16, b: 80 },
    plot_bgcolor: 'white', paper_bgcolor: 'white',
    height: 440,
    hovermode: 'closest',
  };

  Plotly.purge('scatter-chart');
  Plotly.newPlot('scatter-chart', traces, layout, { responsive: true, displayModeBar: false });
}

// ── HS application history ────────────────────────────────────────────────────
function renderHistory(college) {
  const hist = college.hs_history;
  const hchart = document.getElementById('history-chart');
  const hnd = document.getElementById('history-nodata');
  if (!hist || hist.length === 0) {
    hchart.style.display = 'none'; hnd.style.display = '';
    return;
  }
  hchart.style.display = ''; hnd.style.display = 'none';

  const years = hist.map(h => h.year.toString());
  const applied  = hist.map(h => h.applied  ?? 0);
  const accepted = hist.map(h => h.accepted ?? 0);
  const enrolled = hist.map(h => h.enrolled ?? null);

  const traces = [
    { type: 'bar', name: 'Applied',  x: years, y: applied,
      marker: { color: '#94a3b8' }, hovertemplate: 'Applied: %{y}<extra></extra>' },
    { type: 'bar', name: 'Accepted', x: years, y: accepted,
      marker: { color: '#22c55e' }, hovertemplate: 'Accepted: %{y}<extra></extra>' },
  ];
  if (enrolled.some(v => v != null)) {
    traces.push({
      type: 'bar', name: 'Enrolled', x: years,
      y: enrolled.map(v => v ?? 0),
      marker: { color: '#3b82f6' }, hovertemplate: 'Enrolled: %{y}<extra></extra>',
    });
  }

  // acceptance rate line overlay
  const rates = hist.map((h, i) =>
    (h.accepted != null && applied[i] > 0) ? +(h.accepted / applied[i] * 100).toFixed(1) : null
  );
  if (rates.some(v => v != null)) {
    traces.push({
      type: 'scatter', mode: 'lines+markers', name: 'Accept %',
      x: years, y: rates,
      yaxis: 'y2',
      line: { color: '#7c3aed', width: 2 }, marker: { size: 7 },
      hovertemplate: 'Accept rate: %{y}%<extra></extra>',
    });
  }

  const layout = {
    barmode: 'group',
    xaxis: { title: 'Year', gridcolor: '#f1f5f9' },
    yaxis: { title: 'Students', gridcolor: '#f1f5f9', zeroline: false },
    yaxis2: { title: 'Accept %', overlaying: 'y', side: 'right',
              showgrid: false, zeroline: false, range: [0, 100] },
    legend: { orientation: 'h', y: -0.2, font: { size: 12 } },
    margin: { l: 50, r: 50, t: 16, b: 70 },
    plot_bgcolor: 'white', paper_bgcolor: 'white',
    height: 280,
    hovermode: 'x unified',
  };

  Plotly.purge('history-chart');
  Plotly.newPlot('history-chart', traces, layout, { responsive: true, displayModeBar: false });
}
</script>
</body>
</html>
